<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾链接 · 媒体下载工具</title>
<style>
:root{font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#21312e;background:#f3f5f1}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:48px auto;padding:0 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-size:14px;color:#668078;letter-spacing:2px}h1{font-size:30px;margin:10px 0;font-weight:650}p{color:#718079;font-size:14px;line-height:1.7}.pill{background:#e1ebe3;border-radius:20px;padding:8px 14px;font-size:12px;color:#43715b}.card{background:#fff;border:1px solid #dfe5df;border-radius:18px;padding:26px;margin-bottom:20px;box-shadow:0 8px 28px #263d2905}label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}textarea,input{font:inherit;width:100%;border:1px solid #dce3de;background:#fafcf9;border-radius:10px;padding:14px;color:#243b30;outline:none}textarea{min-height:150px;resize:vertical;font-size:14px;line-height:1.7}textarea:focus,input:focus{border-color:#397956;box-shadow:0 0 0 3px #39795615}.row{display:flex;gap:12px;align-items:center}.output{margin-top:22px}.output input{flex:1;min-width:0;font-size:13px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:16px}button{font:inherit;border:1px solid #dce3de;border-radius:9px;background:#fff;padding:11px 16px;color:#334d40;cursor:pointer;white-space:nowrap;font-size:13px}button:hover{background:#f1f6f0}button:disabled{opacity:.5;cursor:wait}.primary{background:#286344;color:white;border-color:#286344;padding:13px 30px;font-size:14px}.primary:hover{background:#204f37}.login{display:flex;gap:8px;flex-wrap:wrap}.caption{font-size:12px;color:#7a887d;margin-top:12px}.notice{min-height:24px;margin:12px 0;color:#43715b;font-size:13px}.notice.error{color:#b04438}.section-title{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px;font-size:16px;font-weight:600}.count{font-size:12px;color:#718079;font-weight:400}.empty{text-align:center;padding:34px;color:#879289;font-size:14px}.job{padding:20px 0;border-bottom:1px solid #eef0eb}.job:last-child{border-bottom:0}.job:first-child{padding-top:0}.jobhead{display:flex;gap:12px;justify-content:space-between}.title{font-size:14px;font-weight:600;overflow-wrap:anywhere}.status{font-size:12px;white-space:nowrap;color:#447358}.url{color:#8a958d;font-size:12px;margin-top:8px;overflow-wrap:anywhere}.bar{height:5px;background:#eef2eb;border-radius:5px;margin-top:14px;overflow:hidden}.fill{height:100%;background:#478762;transition:width .2s}.detail{font-size:12px;margin-top:8px;color:#77887c}.failed{color:#b04438}footer{font-size:12px;color:#89948b;margin-top:22px;line-height:1.8}@media(max-width:650px){main{margin:24px auto;padding:0 16px}.card{padding:20px}.actions{align-items:stretch;flex-direction:column}.output .row{flex-direction:column;align-items:stretch}header{align-items:flex-start}.pill{display:none}h1{font-size:26px}}
</style>
<main>
<header><div><div class="brand">拾链接 / LOCAL MEDIA</div><h1>好内容，保存到本地。</h1><p>粘贴分享链接，让下载变得简单。</p></div><span class="pill">本地运行 · 无需安装插件</span></header>
<section class="card">
<label for="links">分享链接</label><textarea id="links" placeholder="粘贴抖音、小红书或B站链接，也可以直接粘贴整段分享文案。&#10;多个链接可以分行输入。"></textarea>
<div class="output"><label for="output">保存到</label><div class="row"><input id="output" aria-label="保存目录"><button id="folder">打开文件夹</button></div></div>
<div class="actions"><div class="login"><button data-login="douyin">登录抖音</button><button data-login="xiaohongshu">登录小红书</button><button data-login="bilibili">登录B站</button></div><button class="primary" id="download">开始下载 →</button></div>
<div class="caption">首次使用可先登录。登录完成后回到这里；同名文件会自动编号保存。</div>
</section>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<div class="section-title"><span>下载任务</span><span class="count" id="count">暂无任务</span></div>
<section class="card" id="jobs"><div class="empty">粘贴一个链接，开始你的第一次下载。</div></section>
<footer>抖音 · 小红书 · B站　｜　B站支持登录后获取1080P及音视频合并。<br>抖音和小红书适配仍待实际链接验证，部分作品可能需要登录或完整分享链接。</footer>
</main>
<script>
const $=id=>document.getElementById(id);let initialized=false;
function notice(text,error=false){$('notice').textContent=text;$('notice').className='notice'+(error?' error':'')}
async function post(endpoint,body={}){const response=await fetch('/api/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error);return data}
const names={douyin:'抖音',xiaohongshu:'小红书',bilibili:'B站'};
function render(state){if(!initialized){$('output').value=state.output;initialized=true}$('download').disabled=state.busy;$('download').textContent=state.busy?'下载进行中…':'开始下载 →';document.querySelectorAll('[data-login]').forEach(button=>button.disabled=state.busy);$('output').disabled=state.busy;const done=state.jobs.filter(job=>job.status==='完成').length;$('count').textContent=state.jobs.length?`${done} / ${state.jobs.length} 已完成`:'暂无任务';if(!state.jobs.length)return;$('jobs').replaceChildren();for(const job of state.jobs){const el=document.createElement('div');el.className='job';el.innerHTML='<div class="jobhead"><div class="title"></div><div class="status"></div></div><div class="url"></div><div class="bar"><div class="fill"></div></div><div class="detail"></div>';el.querySelector('.title').textContent=job.title||`${names[job.platform]} · 等待解析`;el.querySelector('.status').textContent=job.status+(job.quality?' · '+job.quality:'');el.querySelector('.url').textContent=job.url;el.querySelector('.fill').style.width=(job.percent||0)+'%';el.querySelector('.detail').textContent=job.error||job.progress||'排队等待中';if(job.error)el.querySelector('.detail').classList.add('failed');$('jobs').append(el)}}
$('download').onclick=async()=>{try{await post('download',{text:$('links').value,output:$('output').value});notice('任务已加入队列，下载完成后可打开文件夹。')}catch(error){notice(error.message,true)}};
$('folder').onclick=async()=>{try{await post('open-folder')}catch(error){notice(error.message,true)}};
document.querySelectorAll('[data-login]').forEach(button=>button.onclick=async()=>{button.disabled=true;notice('正在打开登录窗口…');try{const result=await post('login',{platform:button.dataset.login});notice(result.message)}catch(error){notice(error.message,true)}finally{button.disabled=false}});
const events=new EventSource('/api/events');events.onmessage=event=>render(JSON.parse(event.data));events.onerror=()=>notice('正在连接本地服务；请保持启动工具的终端打开。',true);
</script>
</html>
